<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 48" role="img" aria-label="ReactiveDynamics.jl — the firing glyph: an outlined place, a teal transition bar, a filled place.">
  <!-- The Firing Glyph — reversed-out mark for the DARK-theme sidebar (pale strokes on
       the warm-dark panel, teal bar retained). Canonical mark from the Claude Design
       identity board (spec/design_system.html, #rd-mark): place → transition → place on
       an 8px grid, r=11, bar 6×32. `logo.svg` is the ink twin for the light-theme
       (off-white) sidebar. -->
  <circle cx="20" cy="24" r="11" fill="none" stroke="#F4F4F2" stroke-width="2"/>
  <line x1="34" y1="24" x2="49" y2="24" stroke="#F4F4F2" stroke-width="2"/>
  <polygon points="55,24 47,20 47,28" fill="#F4F4F2"/>
  <rect x="57" y="8" width="6" height="32" fill="#0A8A84"/>
  <line x1="66" y1="24" x2="87" y2="24" stroke="#F4F4F2" stroke-width="2"/>
  <polygon points="93,24 85,20 85,28" fill="#F4F4F2"/>
  <circle cx="104" cy="24" r="11" fill="#F4F4F2"/>
</svg>
