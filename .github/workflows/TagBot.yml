# Creates a GitHub release whenever a new version is registered in the General registry
# (JuliaRegistries/TagBot comments on the registration PR to trigger this run). Also runs on a
# cron as a fallback in case the dispatch is missed.
name: TagBot
on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      lookback:
        default: '3'
  schedule:
    - cron: '0 0 * * *'

permissions:
  actions: read
  checks: read
  contents: write
  deployments: read
  issues: read
  discussions: read
  packages: read
  pages: read
  pull-requests: read
  repository-projects: read
  security-events: read
  statuses: read

jobs:
  TagBot:
    # Only react to the registrator bot's comments (or manual dispatch), not arbitrary comments.
    if: github.event_name == 'workflow_dispatch' || github.actor == 'JuliaTagBot'
    runs-on: ubuntu-latest
    steps:
      - uses: JuliaRegistries/TagBot@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ssh: ${{ secrets.DOCUMENTER_KEY }}
