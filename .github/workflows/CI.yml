# Tests (version × OS matrix + nightly + downgrade-compat) and documentation build/deploy.
# The formatter, TagBot and CompatHelper live in sibling workflows.
name: CI
on:
  push:
    branches: [main]
    tags: ['*']
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same ref (but never on main — those deploy docs / coverage).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    permissions:
      actions: write   # julia-actions/cache prunes stale caches
      contents: read
    strategy:
      fail-fast: false
      matrix:
        version:
          - '1.12'   # minimum supported (matches [compat] julia)
          - '1'      # latest stable
        os:
          - ubuntu-latest
          - macOS-latest
          - windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.version }}
      - uses: julia-actions/cache@v2
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
      - uses: julia-actions/julia-processcoverage@v1
      - uses: codecov/codecov-action@v5
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
        continue-on-error: true   # don't fail the build if coverage upload hiccups / token unset

  # Latest nightly Julia — informational only, allowed to break.
  test-nightly:
    name: Julia nightly - ubuntu-latest
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 90
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v2
        with:
          version: nightly
      - uses: julia-actions/cache@v2
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1

  # Validate the LOWER bounds in [compat] actually resolve and pass (CompatHelper only raises
  # the upper bounds). If this ever red-lines on a transitive dep with an unsatisfiable floor,
  # bump that dep's floor in Project.toml or add it to `skip` below.
  downgrade:
    name: Downgrade compat
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.12'
      - uses: julia-actions/julia-downgrade-compat@v1
        with:
          skip: Random, Statistics, TOML   # stdlibs pinned to the Julia version
      - uses: julia-actions/cache@v2
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write      # push to gh-pages
      pull-requests: read  # PR preview deploys
      statuses: write      # documenter preview status
    steps:
      - uses: actions/checkout@v7
      # The tutorials/case-studies render network exec-maps through Graphviz's `dot`; without a
      # backend they degrade to raw DOT source (see docs/literate/**), so install it for full pages.
      - name: Install Graphviz
        run: sudo apt-get update && sudo apt-get install -y graphviz
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1'
      - uses: julia-actions/cache@v2
      # Instantiates docs/Project.toml, devs the package, runs docs/make.jl (which also runs the
      # doctests, since makedocs defaults to doctest=true), and deploys via deploydocs.
      - uses: julia-actions/julia-docdeploy@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCUMENTER_KEY: ${{ secrets.DOCUMENTER_KEY }}
