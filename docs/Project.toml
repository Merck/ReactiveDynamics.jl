# Documentation build environment for ReactiveDynamics.jl.
#
# The site is built with Documenter (HTML backend, GitHub Pages deploy) over Literate
# sources under docs/literate/**. This replaces the deprecated DocumenterMarkdown backend
# the old make.jl used. Statistics is here because the tutorial/case-study Literate sources
# reduce ensembles (mean/std/quantile) at build time; Markdown backs the standalone
# self-contained HTML render path for the case studies (see build_literate.jl).
#
# ReactiveDynamics is path-dev'd; AlgebraicAgents (0.4) resolves from the General registry.
# Plots is here because tutorials render inline figures (the Julia intro-tutorial idiom for a
# trajectory-producing engine); loading it also triggers RDPlotsExt. Arrow/DataFrames/
# Distributions will be added when the case-study renders need them (mirroring the demo-local envs).
#
# First time:  julia --project=docs -e 'using Pkg; Pkg.instantiate()'
# Build:       julia --project=docs docs/make.jl

[deps]
Documenter = "e30172f5-a6a5-5a46-863b-614d45cd2de4"
Literate = "98b081ad-f1c9-55d3-8b20-4c87d4299306"
Markdown = "d6f4376e-aef5-505a-96c1-9c027394607a"
Plots = "91a5bcdd-55d7-5caf-9e0b-520d859cae80"
ReactiveDynamics = "c7456e7d-545a-4b79-91ea-6e93d96dd4d4"
Statistics = "10745b16-79ce-11e8-11f9-7d13ad32a3b2"

[sources]
ReactiveDynamics = {path = ".."}
