<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 48" role="img" aria-label="ReactiveDynamics.jl">
  <!-- Horizontal lockup: the Firing Glyph + wordmark set in Inter. From the Claude Design
       identity board (spec/design_system.html). The mark keeps its 128×48 grid; the
       wordmark baseline aligns to the glyph centre. -->
  <style>
    .wm{font-family:'Inter',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif;font-weight:700;letter-spacing:-0.025em}
    .wm-jl{fill:#0A8A84}
  </style>
  <!-- mark -->
  <circle cx="20" cy="24" r="11" fill="none" stroke="#0A0A0A" stroke-width="2"/>
  <line x1="34" y1="24" x2="49" y2="24" stroke="#0A0A0A" stroke-width="2"/>
  <polygon points="55,24 47,20 47,28" fill="#0A0A0A"/>
  <rect x="57" y="8" width="6" height="32" fill="#0A8A84"/>
  <line x1="66" y1="24" x2="87" y2="24" stroke="#0A0A0A" stroke-width="2"/>
  <polygon points="93,24 85,20 85,28" fill="#0A0A0A"/>
  <circle cx="104" cy="24" r="11" fill="#0A0A0A"/>
  <!-- wordmark -->
  <text class="wm" x="150" y="33" font-size="30" fill="#0A0A0A">ReactiveDynamics<tspan class="wm-jl">.jl</tspan></text>
</svg>
