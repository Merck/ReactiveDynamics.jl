<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 48" role="img" aria-label="ReactiveDynamics.jl — the firing glyph: an outlined place, an azure transition bar, a filled place.">
  <!-- The Firing Glyph — full-colour mark for light grounds (README hero, favicon).
       Canonical mark from the Claude Design identity board (spec/design_system.html,
       #rd-mark): place → transition → place on an 8px grid, r=11, bar 6×32. Reads at 16px. -->
  <circle cx="20" cy="24" r="11" fill="none" stroke="#0A0A0A" stroke-width="2"/>
  <line x1="34" y1="24" x2="49" y2="24" stroke="#0A0A0A" stroke-width="2"/>
  <polygon points="55,24 47,20 47,28" fill="#0A0A0A"/>
  <rect x="57" y="8" width="6" height="32" fill="#0A47FF"/>
  <line x1="66" y1="24" x2="87" y2="24" stroke="#0A0A0A" stroke-width="2"/>
  <polygon points="93,24 85,20 85,28" fill="#0A0A0A"/>
  <circle cx="104" cy="24" r="11" fill="#0A0A0A"/>
</svg>
