<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 581" width="100%" height="581" preserveAspectRatio="xMidYMid meet" role="img"><title>Inside the copilot: who does what, and what passes between them — One orchestrator, four phase skills that each leave a file, and one CLI underneath. Work passes between the phases only as files on disk, which is what makes each one re-runnable and auditable.</title><text x="18" y="21" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, system-ui, sans-serif" font-size="14.5" fill="#0A0A0A" font-weight="600">Inside the copilot: who does what, and what passes between them</text><text x="18" y="38" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, system-ui, sans-serif" font-size="11.5" fill="#6A6A68">One orchestrator, four phase skills that each leave a file, and one CLI underneath. Work passes between the phases</text><text x="18" y="53" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, system-ui, sans-serif" font-size="11.5" fill="#6A6A68">only as files on disk, which is what makes each one re-runnable and auditable.</text><rect x="18" y="77" width="724" height="44" fill="#F7FBFB" stroke="#0A8A84" stroke-width="1.4"/><text x="32" y="95" font-family="'JetBrains Mono', 'SF Mono', ui-monospace, monospace" font-size="11.4" fill="#076A65" font-weight="600">rd-study</text><text x="104" y="95" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, system-ui, sans-serif" font-size="11" fill="#0A0A0A" font-weight="600">the orchestrator</text><text x="32" y="111" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, system-ui, sans-serif" font-size="8.8" fill="#6A6A68">reads the study directory, resumes at the phase it implies, enforces every gate, never skips a phase</text><rect x="602.08" y="85" width="127.92" height="15" fill="#FFFFFF" stroke="#C7C7C4" stroke-width="1"/><text x="608.08" y="96" font-family="'JetBrains Mono', 'SF Mono', ui-monospace, monospace" font-size="8.4" fill="#6A6A68">/rd:study command · W12</text><line x1="104" y1="124" x2="104" y2="142" stroke="#C7C7C4" stroke-width="1.4"/><path d="M 100.0 141.0 L 104.0 147.0 L 108.0 141.0 Z" fill="#C7C7C4"/><line x1="288" y1="124" x2="288" y2="142" stroke="#C7C7C4" stroke-width="1.4"/><path d="M 284.0 141.0 L 288.0 147.0 L 292.0 141.0 Z" fill="#C7C7C4"/><line x1="472" y1="124" x2="472" y2="142" stroke="#C7C7C4" stroke-width="1.4"/><path d="M 468.0 141.0 L 472.0 147.0 L 476.0 141.0 Z" fill="#C7C7C4"/><line x1="656" y1="124" x2="656" y2="142" stroke="#C7C7C4" stroke-width="1.4"/><path d="M 652.0 141.0 L 656.0 147.0 L 660.0 141.0 Z" fill="#C7C7C4"/><rect x="18" y="147" width="172" height="152" fill="#FFFFFF" stroke="#C7C7C4" stroke-width="1"/><rect x="18" y="147" width="172" height="2.5" fill="#0A8A84"/><text x="29" y="167" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, system-ui, sans-serif" font-size="11.6" fill="#0A0A0A" font-weight="600">FRAME</text><text x="179" y="166" font-family="'JetBrains Mono', 'SF Mono', ui-monospace, monospace" font-size="8.6" fill="#076A65" text-anchor="end">rd-frame</text><text x="29" y="183" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, system-ui, sans-serif" font-size="8.8" fill="#0A0A0A">interviews the owner; does the</text><text x="29" y="193.5" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, system-ui, sans-serif" font-size="8.8" fill="#0A0A0A">qualifying arithmetic</text><text x="29" y="215" font-family="'JetBrains Mono', 'SF Mono', ui-monospace, monospace" font-size="7.4" fill="#9A9A98">WRITES</text><text x="29" y="226" font-family="'JetBrains Mono', 'SF Mono', ui-monospace, monospace" font-size="8.4" fill="#B5740A">BRIEF.md</text><text x="29" y="242" font-family="'JetBrains Mono', 'SF Mono', ui-monospace, monospace" font-size="7.4" fill="#9A9A98">CALLS</text><text x="29" y="253" font-family="'JetBrains Mono', 'SF Mono', ui-monospace, monospace" font-size="8.4" fill="#076A65">no rdx: plain arithmetic</text><text x="29" y="269" font-family="'JetBrains Mono', 'SF Mono', ui-monospace, monospace" font-size="7.4" fill="#9A9A98">GATE</text><text x="29" y="280" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, system-ui, sans-serif" font-size="8.4" fill="#6A6A68">something binds, or stop here</text><line x1="191" y1="173" x2="196" y2="173" stroke="#C7C7C4" stroke-width="1.4"/><path d="M 195.0 169.0 L 201.0 173.0 L 195.0 177.0 Z" fill="#C7C7C4"/><rect x="202" y="147" width="172" height="152" fill="#FFFFFF" stroke="#C7C7C4" stroke-width="1"/><rect x="202" y="147" width="172" height="2.5" fill="#0A8A84"/><text x="213" y="167" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, system-ui, sans-serif" font-size="11.6" fill="#0A0A0A" font-weight="600">AUTHOR</text><text x="363" y="166" font-family="'JetBrains Mono', 'SF Mono', ui-monospace, monospace" font-size="8.6" fill="#076A65" text-anchor="end">rd-author</text><text x="213" y="183" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, system-ui, sans-serif" font-size="8.8" fill="#0A0A0A">writes one JSON model per</text><text x="213" y="193.5" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, system-ui, sans-serif" font-size="8.8" fill="#0A0A0A">option, calibrates it</text><text x="213" y="215" font-family="'JetBrains Mono', 'SF Mono', ui-monospace, monospace" font-size="7.4" fill="#9A9A98">WRITES</text><text x="213" y="226" font-family="'JetBrains Mono', 'SF Mono', ui-monospace, monospace" font-size="8.4" fill="#B5740A">model.rdj.json + arm_*</text><text x="213" y="242" font-family="'JetBrains Mono', 'SF Mono', ui-monospace, monospace" font-size="7.4" fill="#9A9A98">CALLS</text><text x="213" y="253" font-family="'JetBrains Mono', 'SF Mono', ui-monospace, monospace" font-size="8.4" fill="#076A65">validate · run</text><text x="213" y="269" font-family="'JetBrains Mono', 'SF Mono', ui-monospace, monospace" font-size="7.4" fill="#9A9A98">GATE</text><text x="213" y="280" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, system-ui, sans-serif" font-size="8.4" fill="#6A6A68">zero validate errors; each arm</text><text x="213" y="290.2" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, system-ui, sans-serif" font-size="8.4" fill="#6A6A68">differs only in its lever</text><line x1="375" y1="173" x2="380" y2="173" stroke="#C7C7C4" stroke-width="1.4"/><path d="M 379.0 169.0 L 385.0 173.0 L 379.0 177.0 Z" fill="#C7C7C4"/><rect x="386" y="147" width="172" height="152" fill="#FFFFFF" stroke="#C7C7C4" stroke-width="1"/><rect x="386" y="147" width="172" height="2.5" fill="#0A8A84"/><text x="397" y="167" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, system-ui, sans-serif" font-size="11.6" fill="#0A0A0A" font-weight="600">DIAGNOSE</text><text x="547" y="166" font-family="'JetBrains Mono', 'SF Mono', ui-monospace, monospace" font-size="8.6" fill="#076A65" text-anchor="end">rd-doctor</text><text x="397" y="183" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, system-ui, sans-serif" font-size="8.8" fill="#0A0A0A">tries to break the model</text><text x="397" y="193.5" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, system-ui, sans-serif" font-size="8.8" fill="#0A0A0A">before anyone trusts it</text><text x="397" y="215" font-family="'JetBrains Mono', 'SF Mono', ui-monospace, monospace" font-size="7.4" fill="#9A9A98">WRITES</text><text x="397" y="226" font-family="'JetBrains Mono', 'SF Mono', ui-monospace, monospace" font-size="8.4" fill="#B5740A">DOCTOR.md</text><text x="397" y="242" font-family="'JetBrains Mono', 'SF Mono', ui-monospace, monospace" font-size="7.4" fill="#9A9A98">CALLS</text><text x="397" y="253" font-family="'JetBrains Mono', 'SF Mono', ui-monospace, monospace" font-size="8.4" fill="#076A65">diagnose</text><text x="397" y="269" font-family="'JetBrains Mono', 'SF Mono', ui-monospace, monospace" font-size="7.4" fill="#9A9A98">GATE</text><text x="397" y="280" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, system-ui, sans-serif" font-size="8.4" fill="#6A6A68">nine checks pass, or each</text><text x="397" y="290.2" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, system-ui, sans-serif" font-size="8.4" fill="#6A6A68">failure explained</text><line x1="559" y1="173" x2="564" y2="173" stroke="#C7C7C4" stroke-width="1.4"/><path d="M 563.0 169.0 L 569.0 173.0 L 563.0 177.0 Z" fill="#C7C7C4"/><rect x="570" y="147" width="172" height="152" fill="#FFFFFF" stroke="#C7C7C4" stroke-width="1"/><rect x="570" y="147" width="172" height="2.5" fill="#0A0A0A"/><text x="581" y="167" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, system-ui, sans-serif" font-size="11.6" fill="#0A0A0A" font-weight="600">REPORT</text><text x="731" y="166" font-family="'JetBrains Mono', 'SF Mono', ui-monospace, monospace" font-size="8.6" fill="#076A65" text-anchor="end">rd-report</text><text x="581" y="183" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, system-ui, sans-serif" font-size="8.8" fill="#0A0A0A">measures the options against</text><text x="581" y="193.5" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, system-ui, sans-serif" font-size="8.8" fill="#0A0A0A">each other</text><text x="581" y="215" font-family="'JetBrains Mono', 'SF Mono', ui-monospace, monospace" font-size="7.4" fill="#9A9A98">WRITES</text><text x="581" y="226" font-family="'JetBrains Mono', 'SF Mono', ui-monospace, monospace" font-size="8.4" fill="#B5740A">FINDINGS.md → REPORT.html</text><text x="581" y="242" font-family="'JetBrains Mono', 'SF Mono', ui-monospace, monospace" font-size="7.4" fill="#9A9A98">CALLS</text><text x="581" y="253" font-family="'JetBrains Mono', 'SF Mono', ui-monospace, monospace" font-size="8.4" fill="#076A65">effect · ensemble · draw</text><text x="581" y="269" font-family="'JetBrains Mono', 'SF Mono', ui-monospace, monospace" font-size="7.4" fill="#9A9A98">GATE</text><text x="581" y="280" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, system-ui, sans-serif" font-size="8.4" fill="#6A6A68">every number carries a spread</text><text x="581" y="290.2" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, system-ui, sans-serif" font-size="8.4" fill="#6A6A68">and a seed</text><path d="M 472.0 299.0 L 472.0 315.0 L 288.0 315.0 L 288.0 305.0" fill="none" stroke="#E5243B" stroke-width="1.4"/><path d="M 284.0 306.0 L 288.0 300.0 L 292.0 306.0 Z" fill="#E5243B"/><text x="380" y="327" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, system-ui, sans-serif" font-size="8.6" fill="#E5243B" text-anchor="middle">a failed check sends the model back to AUTHOR, with the check that failed</text><text x="18" y="336" font-family="'JetBrains Mono', 'SF Mono', ui-monospace, monospace" font-size="8" fill="#9A9A98">PLANNED, ATTACHED TO THE PHASE THEY SERVE</text><rect x="18" y="341.0" width="356.0" height="80.0" fill="#FFFFFF" stroke="#9A9A98" stroke-width="1" stroke-dasharray="4 3"/><text x="29" y="358" font-family="'JetBrains Mono', 'SF Mono', ui-monospace, monospace" font-size="9.6" fill="#0A0A0A" font-weight="600">rd-modeler</text><text x="29" y="371" font-family="'JetBrains Mono', 'SF Mono', ui-monospace, monospace" font-size="7.4" fill="#9A9A98">SERVES AUTHOR</text><rect x="340.92" y="347" width="22.08" height="15" fill="#FFFFFF" stroke="#C7C7C4" stroke-width="1"/><text x="346.92" y="358" font-family="'JetBrains Mono', 'SF Mono', ui-monospace, monospace" font-size="8.4" fill="#6A6A68">W9</text><text x="29" y="386" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, system-ui, sans-serif" font-size="8.5" fill="#6A6A68">a subagent: runs write → validate → repair in its own context, hands</text><text x="29" y="396.5" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, system-ui, sans-serif" font-size="8.5" fill="#6A6A68">back only the model</text><rect x="386.0" y="341.0" width="172.0" height="80.0" fill="#FFFFFF" stroke="#9A9A98" stroke-width="1" stroke-dasharray="4 3"/><text x="397" y="358" font-family="'JetBrains Mono', 'SF Mono', ui-monospace, monospace" font-size="9.6" fill="#0A0A0A" font-weight="600">validate hook</text><text x="397" y="371" font-family="'JetBrains Mono', 'SF Mono', ui-monospace, monospace" font-size="7.4" fill="#9A9A98">SERVES AUTHOR</text><rect x="519.88" y="347" width="27.12" height="15" fill="#FFFFFF" stroke="#C7C7C4" stroke-width="1"/><text x="525.88" y="358" font-family="'JetBrains Mono', 'SF Mono', ui-monospace, monospace" font-size="8.4" fill="#6A6A68">W10</text><text x="397" y="386" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, system-ui, sans-serif" font-size="8.5" fill="#6A6A68">re-checks every *.rdj.json</text><text x="397" y="396.5" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, system-ui, sans-serif" font-size="8.5" fill="#6A6A68">write; no prompt can skip it</text><rect x="570.0" y="341.0" width="172.0" height="80.0" fill="#FFFFFF" stroke="#9A9A98" stroke-width="1" stroke-dasharray="4 3"/><text x="581" y="358" font-family="'JetBrains Mono', 'SF Mono', ui-monospace, monospace" font-size="9.6" fill="#0A0A0A" font-weight="600">rd-critic</text><text x="581" y="371" font-family="'JetBrains Mono', 'SF Mono', ui-monospace, monospace" font-size="7.4" fill="#9A9A98">SERVES REPORT</text><rect x="708.92" y="347" width="22.08" height="15" fill="#FFFFFF" stroke="#C7C7C4" stroke-width="1"/><text x="714.92" y="358" font-family="'JetBrains Mono', 'SF Mono', ui-monospace, monospace" font-size="8.4" fill="#6A6A68">W9</text><text x="581" y="386" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, system-ui, sans-serif" font-size="8.5" fill="#6A6A68">a subagent with fresh context:</text><text x="581" y="396.5" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, system-ui, sans-serif" font-size="8.5" fill="#6A6A68">the model against the brief, the</text><text x="581" y="407" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, system-ui, sans-serif" font-size="8.5" fill="#6A6A68">prose against the numbers</text><line x1="380" y1="424" x2="380" y2="440" stroke="#C7C7C4" stroke-width="1.4"/><path d="M 376.0 439.0 L 380.0 445.0 L 384.0 439.0 Z" fill="#C7C7C4"/><rect x="18" y="445" width="724" height="62" fill="#F7FBFB" stroke="#0A8A84" stroke-width="1.4"/><text x="32" y="464" font-family="'JetBrains Mono', 'SF Mono', ui-monospace, monospace" font-size="11.4" fill="#076A65" font-weight="600">rdx</text><text x="66" y="464" font-family="'JetBrains Mono', 'SF Mono', ui-monospace, monospace" font-size="9.4" fill="#0A0A0A">validate · run · diagnose · ensemble · effect · draw</text><rect x="680.72" y="453" width="47.28" height="15" fill="#E8F3F2" stroke="#BFDEDB" stroke-width="1"/><text x="686.72" y="464" font-family="'JetBrains Mono', 'SF Mono', ui-monospace, monospace" font-size="8.4" fill="#076A65">SHIPPED</text><text x="32" y="481" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, system-ui, sans-serif" font-size="8.8" fill="#6A6A68">Today every skill reaches it through Bash: JSON on stdout, exit 0 ok / 1 findings / 2 error.</text><text x="32" y="496" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, system-ui, sans-serif" font-size="8.8" fill="#6A6A68">Next, the same six verbs as MCP tools (rd_validate, rd_run, …) over a warm Julia session, for hosts with no terminal.</text><rect x="675.68" y="485" width="52.32" height="15" fill="#FFFFFF" stroke="#C7C7C4" stroke-width="1"/><text x="681.68" y="496" font-family="'JetBrains Mono', 'SF Mono', ui-monospace, monospace" font-size="8.4" fill="#6A6A68">MCP · W8</text><line x1="380" y1="510" x2="380" y2="524" stroke="#C7C7C4" stroke-width="1.4"/><path d="M 376.0 523.0 L 380.0 529.0 L 384.0 523.0 Z" fill="#C7C7C4"/><rect x="18" y="529" width="724" height="44" fill="#0A0A0A"/><text x="34" y="547" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, system-ui, sans-serif" font-size="11.2" fill="#F4F4F2" font-weight="600">ReactiveDynamics.jl</text><text x="34" y="563" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, system-ui, sans-serif" font-size="8.8" fill="#C7C7C4">validate is pure and returns every problem with its path · (model, seed) fixes a run, byte for byte</text><text x="726" y="547" font-family="'JetBrains Mono', 'SF Mono', ui-monospace, monospace" font-size="8.4" fill="#3FB5AF" text-anchor="end">on AlgebraicAgents.jl</text></svg>
