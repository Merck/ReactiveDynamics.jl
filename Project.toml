# AlgebraicAgents 0.4 (the ADR 0012/0013/0014 integration target) is now published to the General
# registry, so RD resolves it as an ordinary registered dependency — no GitHub `[sources]` pin needed
# (the earlier `rev = "main"` pin predated the 0.4 registry release). `[compat] AlgebraicAgents` below
# tracks the supported major.

# Optional, lazily-loaded backends (ADR 0013 §C / ADR 0014 §A2). Both extensions carry their
# heavy dependency as a weakdep so the core package stays lean and loads with them absent:
#   • RDPlotsExt  — the seven result-plot @recipes + the generic `_draw` reduction (needs Plots).
#   • RDArrowExt  — the byte-faithful Arrow writer for the rectangular export artifacts (needs Arrow).
# Plots was a hard dep historically; it is now weak because the ONLY core code that used it was the
# now-removed dead SciML plotting + `_draw`, and `_draw` moved into the extension.
[weakdeps]
Arrow = "69666777-d1a9-59fb-9406-91d4454c9d45"
Plots = "91a5bcdd-55d7-5caf-9e0b-520d859cae80"

[extensions]
RDArrowExt = "Arrow"
RDPlotsExt = "Plots"

