# Demo-local environment for the introspection & exec-map tour.
#
# The main ReactiveDynamics project is intentionally LEAN: Plots and Arrow are weakdeps (they back
# the RDPlotsExt/RDArrowExt extensions), so `julia --project=.` does not resolve them. This tour DOES
# need Plots (to render the network exec map through AA's Graphviz backend and the §15.1 recipes) and
# benefits from Arrow (the §14.3 export bundle then writes byte-faithful `.arrow` siblings beside the
# CSV/JSON core). So this environment adds them on top of a path-dev'd ReactiveDynamics; loading
# Plots/Arrow here also triggers the two extensions, so the recipes and the Arrow siblings are live.
#
# Run any script with:   julia --project=demo/introspection_tour demo/introspection_tour/<script>.jl
# First time:            julia --project=demo/introspection_tour -e 'using Pkg; Pkg.instantiate()'
#
# AlgebraicAgents 0.4 (the ADR 0012/0013/0014 integration target) is registered in General, so the
# demo resolves it as an ordinary registered dependency alongside path-dev'd ReactiveDynamics — no
# GitHub `[sources]` pin needed (the earlier tree-sha pin predated the 0.4 registry release).

[deps]
AlgebraicAgents = "f6eb0ae3-10fa-40e6-88dd-9006ba45093a"
Arrow = "69666777-d1a9-59fb-9406-91d4454c9d45"
DataFrames = "a93c6f00-e57d-5684-b7b6-d8193f3e46c0"
Distributions = "31c24e10-a181-5473-b8eb-7969acd0382f"
JSON = "682c06a0-de6a-54ab-a142-c8b1cf79cde6"
Plots = "91a5bcdd-55d7-5caf-9e0b-520d859cae80"
Printf = "de0858da-6303-5e67-8744-51eddeeeb8d7"
Random = "9a3f8284-a2c9-5f02-9a11-845980a1fd5c"
ReactiveDynamics = "c7456e7d-545a-4b79-91ea-6e93d96dd4d4"
Statistics = "10745b16-79ce-11e8-11f9-7d13ad32a3b2"

[sources]
