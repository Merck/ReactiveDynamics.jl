# Demo-local environment for the BD acquisition-impact demo.
#
# The main ReactiveDynamics project is intentionally LEAN: Plots and Arrow are weakdeps (they back
# the RDPlotsExt/RDArrowExt extensions), so `julia --project=.` does not resolve them. The figure and
# export scripts here DO need Plots (and benefit from Arrow), so this environment adds them on top of
# a path-dev'd ReactiveDynamics. Loading Plots/Arrow here also triggers the two extensions, so the
# §15 recipes and the §14.3 Arrow export siblings are live in the demo.
#
# Run any demo script with:   julia --project=demo/bd_acquisition demo/bd_acquisition/<script>.jl
# First time:                 julia --project=demo/bd_acquisition -e 'using Pkg; Pkg.instantiate()'
#
# AlgebraicAgents is pinned to the published GitHub source so the demo tracks the same upstream the
# ADR 0012/0013/0014 integration verifies against. We pin the exact TREE-SHA (v0.3.27) the main
# project's Manifest already resolved, NOT the moving `rev = "main"`: upstream main has since advanced
# to 0.4.x, which violates RD's `[compat] AlgebraicAgents = "0.3"`, so a fresh resolve against `main`
# fails. Pinning the sha keeps the demo env reproducibly resolvable on a clean checkout. A `[sources]`
# entry must also appear in `[deps]`, so AlgebraicAgents is listed there too (it is also a transitive
# dep of ReactiveDynamics, which RD reexports).

[deps]
AlgebraicAgents = "f6eb0ae3-10fa-40e6-88dd-9006ba45093a"
Arrow = "69666777-d1a9-59fb-9406-91d4454c9d45"
DataFrames = "a93c6f00-e57d-5684-b7b6-d8193f3e46c0"
Distributions = "31c24e10-a181-5473-b8eb-7969acd0382f"
JSON = "682c06a0-de6a-54ab-a142-c8b1cf79cde6"
Plots = "91a5bcdd-55d7-5caf-9e0b-520d859cae80"
Printf = "de0858da-6303-5e67-8744-51eddeeeb8d7"
Random = "9a3f8284-a2c9-5f02-9a11-845980a1fd5c"
ReactiveDynamics = "c7456e7d-545a-4b79-91ea-6e93d96dd4d4"
Statistics = "10745b16-79ce-11e8-11f9-7d13ad32a3b2"

[sources]
AlgebraicAgents = {url = "https://github.com/Merck/AlgebraicAgents.jl.git", rev = "8d322a858a05034703faf8ee3dc355afe3b540f7"}
ReactiveDynamics = {path = "../.."}
